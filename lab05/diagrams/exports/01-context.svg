<text x="900.0" y="402.9" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172b42" text-anchor="middle">
<tspan x="900.0" dy="0">Campus Workshop Board</tspan>
<tspan x="900.0" dy="31.200000000000003">[Software system]</tspan>
<tspan x="900.0" dy="31.200000000000003">Student-led workshop website</tspan>
<tspan x="900.0" dy="31.200000000000003">Browse, create and publish workshops;</tspan>
<tspan x="900.0" dy="31.200000000000003">reserve seats and view own bookings;</tspan>
<tspan x="900.0" dy="31.200000000000003">owners view their attendees.</tspan>
</text>
<rect x="65" y="360" width="370" height="220" fill="#e4f4ed" stroke="#506176" stroke-width="2"/>
<text x="250.0" y="420.5" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b42" text-anchor="middle">
<tspan x="250.0" dy="0">University Student</tspan>
<tspan x="250.0" dy="28.6">[Person]</tspan>
<tspan x="250.0" dy="28.6">Browse and reserve;</tspan>
<tspan x="250.0" dy="28.6">create a workshop as its owner.</tspan>
<tspan x="250.0" dy="28.6">Organiser = student owner.</tspan>
</text>
<rect x="1370" y="260" width="370" height="185" fill="#f0f2f5" stroke="#506176" stroke-width="2"/>
<text x="1555.0" y="317.3" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b42" text-anchor="middle">
<tspan x="1555.0" dy="0">Campus Identity</tspan>
<tspan x="1555.0" dy="28.6">[External software system]</tspan>
<tspan x="1555.0" dy="28.6">Verifies university credentials;</tspan>
<tspan x="1555.0" dy="28.6">supplies student ID, name, email.</tspan>
</text>
<rect x="1370" y="650" width="370" height="185" fill="#f0f2f5" stroke="#506176" stroke-width="2"/>
<text x="1555.0" y="707.3" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#172b42" text-anchor="middle">
<tspan x="1555.0" dy="0">University Mail</tspan>
<tspan x="1555.0" dy="28.6">[External software system]</tspan>
<tspan x="1555.0" dy="28.6">Accepts confirmation requests</tspan>
<tspan x="1555.0" dy="28.6">and delivers student email.</tspan>
</text>
